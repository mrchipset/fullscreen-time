<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Time - Test Page</title>
  <style>
    body {
      margin: 0;
      padding: 32px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f6fb;
      color: #1b2433;
    }
    h1 { margin-top: 0; }
    section {
      max-width: 760px;
      margin: 0 auto 24px;
      padding: 20px;
      background: #fff;
      border: 1px solid #dbe2ef;
      border-radius: 12px;
    }
    video { width: 100%; max-width: 640px; display: block; border-radius: 8px; }
    .fs-panel {
      display: grid;
      place-items: center;
      min-height: 240px;
      margin-top: 12px;
      border-radius: 10px;
      background: linear-gradient(135deg, #244b9c, #5b8def);
      color: #fff;
      font-size: 24px;
      font-weight: 700;
    }
    button {
      margin-top: 12px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #2a59d8;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <section>
    <h1>Fullscreen Time — Test Page</h1>
    <p>用这个页面验证原生 <code>&lt;video&gt;</code> 元素全屏；下面的按钮用于验证“非视频元素全屏”。</p>
    <video id="testVideo" controls>
      <source src="https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/720/Big_Buck_Bunny_720_10s_1MB.mp4" type="video/mp4">
    </video>
  </section>

  <section>
    <h2>非视频元素全屏</h2>
    <div class="fs-panel" id="fsPanel">Not a video</div>
    <button id="fsButton" type="button">全屏这个元素</button>
  </section>

  <script>
    document.getElementById('fsButton').addEventListener('click', () => {
      document.getElementById('fsPanel').requestFullscreen();
    });
  </script>
</body>
</html>
