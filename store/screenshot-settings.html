<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>全屏时间显示 — 快捷键设置</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
    color: #f7faff;
    background:
      radial-gradient(760px 600px at 15% 14%, rgba(44, 85, 190, 0.25), transparent 64%),
      radial-gradient(820px 660px at 88% 86%, rgba(62, 106, 255, 0.16), transparent 66%),
      linear-gradient(145deg, #0a1424 0%, #08111e 60%, #070d18 100%);
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; width: 1280px; height: 800px; overflow: hidden; }
  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.65), transparent 64%);
    pointer-events: none;
  }
  .brand {
    position: absolute;
    top: 44px;
    left: 72px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mark {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(145deg, #3a6cf0, #1d43b4);
    box-shadow: 0 10px 26px rgba(23, 69, 196, 0.4);
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .brand-name { font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
  .brand-en { margin-left: 9px; color: #9fb1cc; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }

  .copy {
    position: absolute;
    top: 170px;
    left: 72px;
    width: 520px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    margin: 0 0 20px;
    padding: 7px 12px;
    border: 1px solid rgba(126, 162, 255, 0.28);
    border-radius: 999px;
    background: rgba(22, 44, 84, 0.5);
    color: #a9c4ff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #6f97ff;
    box-shadow: 0 0 0 4px rgba(111, 151, 255, 0.12);
  }
  h1 {
    margin: 0;
    font-size: 64px;
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -0.04em;
  }
  .en-title {
    margin: 12px 0 0;
    color: #8fa4c2;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }
  .lead {
    margin: 22px 0 0;
    color: #b8c9e2;
    font-size: 17.5px;
    line-height: 1.7;
  }
  .bullets { display: grid; gap: 13px; margin-top: 32px; }
  .bullet {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding-left: 2px;
  }
  .bullet-mark {
    flex: 0 0 auto;
    width: 7px;
    height: 7px;
    margin-top: 7px;
    border-radius: 50%;
    background: #5d8cff;
    box-shadow: 0 0 0 4px rgba(93, 140, 255, 0.12);
  }
  .bullet-title { margin: 0; color: #eef4ff; font-size: 14px; font-weight: 700; line-height: 1.4; }
  .bullet-desc { margin: 2px 0 0; color: #95a8c3; font-size: 11.5px; line-height: 1.45; }
  .bottom-note {
    position: absolute;
    left: 74px;
    bottom: 44px;
    color: #7f94b0;
    font-size: 11.5px;
    letter-spacing: 0.04em;
  }

  .shot-card {
    position: absolute;
    top: 112px;
    right: 74px;
    width: 570px;
    height: 570px;
    padding: 20px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(184, 205, 255, 0.2);
    border-radius: 26px;
    background: linear-gradient(180deg, #f5f8fe, #eaf0fa);
    box-shadow:
      0 38px 92px rgba(0, 0, 0, 0.48),
      0 12px 32px rgba(0, 0, 0, 0.26),
      inset 0 1px 0 rgba(255, 255, 255, 0.9);
  }
  .settings-shot {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 14px;
    box-shadow: 0 4px 16px rgba(21, 39, 72, 0.1);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="brand">
      <span class="mark" aria-hidden="true">FT</span>
      <span class="brand-name">全屏时间显示</span>
      <span class="brand-en">Fullscreen Time</span>
    </div>

    <div class="copy">
      <div class="eyebrow">Shortcut settings</div>
      <h1>自定义快捷键</h1>
      <p class="en-title">Custom shortcuts</p>
      <p class="lead">保留 F9 / F10 默认，也可以录制自己的组合键，适配不同键盘与操作习惯。</p>

      <div class="bullets">
        <div class="bullet">
          <span class="bullet-mark"></span>
          <div>
            <p class="bullet-title">F9 / F10 默认</p>
            <p class="bullet-desc">布局切换与显示切换开箱即用</p>
          </div>
        </div>
        <div class="bullet">
          <span class="bullet-mark"></span>
          <div>
            <p class="bullet-title">冲突 / 保留键校验</p>
            <p class="bullet-desc">录制时即时提示，避免无效绑定</p>
          </div>
        </div>
        <div class="bullet">
          <span class="bullet-mark"></span>
          <div>
            <p class="bullet-title">Esc 取消 · Delete 解除绑定</p>
            <p class="bullet-desc">键盘操作完整，状态区实时反馈</p>
          </div>
        </div>
        <div class="bullet">
          <span class="bullet-mark"></span>
          <div>
            <p class="bullet-title">跨页面同步</p>
            <p class="bullet-desc">修改后已打开的设置页自动刷新</p>
          </div>
        </div>
      </div>
    </div>

    <div class="bottom-note">设置保存到 Chrome Sync · 录制结果持久生效</div>
    <div class="shot-card">
      <img class="settings-shot" src="source/settings.png" alt="全屏时间显示软件快捷键设置页面">
    </div>
  </div>
</body>
</html>
