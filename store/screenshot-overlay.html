<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>全屏时间显示 — 全屏效果</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
    background: #08111f;
    color: #f7faff;
    -webkit-font-smoothing: antialiased;
  }
  .stage { position: relative; width: 1280px; height: 800px; overflow: hidden; }
  .hero {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }
  .top-shade {
    position: absolute;
    inset: 0 0 auto 0;
    height: 190px;
    background: linear-gradient(180deg, rgba(3, 8, 16, 0.72), rgba(3, 8, 16, 0));
  }
  .bottom-shade {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(3, 8, 16, 0) 38%, rgba(3, 8, 16, 0.38) 56%, rgba(3, 8, 16, 0.94) 100%),
      linear-gradient(90deg, rgba(3, 8, 16, 0.52), rgba(3, 8, 16, 0) 66%);
  }
  .topbar {
    position: absolute;
    top: 36px;
    left: 48px;
    right: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 13px; }
  .mark {
    display: grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 13px;
    background: linear-gradient(145deg, #3a6cf0, #1d43b4);
    box-shadow: 0 10px 26px rgba(23, 69, 196, 0.42);
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .brand-name { font-size: 17px; font-weight: 700; letter-spacing: 0.02em; }
  .brand-en { margin-left: 9px; font-size: 11px; color: #aebbd2; letter-spacing: 0.08em; text-transform: uppercase; }
  .tag {
    padding: 8px 13px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    background: rgba(7, 15, 29, 0.48);
    color: #dce6f8;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.03em;
    backdrop-filter: blur(8px);
  }
  .copy {
    position: absolute;
    left: 50px;
    bottom: 50px;
    width: 720px;
  }
  .kicker {
    display: flex;
    align-items: center;
    gap: 11px;
    margin: 0 0 15px;
    color: #9fc0ff;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .kicker::before {
    content: "";
    width: 30px;
    height: 2px;
    border-radius: 2px;
    background: #5d8cff;
  }
  h1 {
    margin: 0;
    font-size: 62px;
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -0.035em;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.5);
  }
  .lead {
    margin: 16px 0 0;
    color: #d7e2f5;
    font-size: 19px;
    line-height: 1.6;
    letter-spacing: 0.01em;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.55);
  }
  .features { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 27px; }
  .feature {
    padding: 9px 14px;
    border: 1px solid rgba(167, 196, 255, 0.32);
    border-radius: 8px;
    background: rgba(12, 25, 49, 0.72);
    color: #eef4ff;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    backdrop-filter: blur(8px);
  }
  .feature span { margin-left: 8px; color: #9fb4d4; font-size: 11px; font-weight: 500; }
  .footnote {
    position: absolute;
    right: 48px;
    bottom: 52px;
    color: #aebbd2;
    font-size: 12px;
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
  <div class="stage">
    <img class="hero" src="source/overlay.png" alt="全屏时间显示软件在视频全屏时的实际浮层">
    <div class="top-shade"></div>
    <div class="bottom-shade"></div>

    <div class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">FT</span>
        <span class="brand-name">全屏时间显示</span>
        <span class="brand-en">Fullscreen Time</span>
      </div>
      <span class="tag">Chrome 扩展 · 实际界面</span>
    </div>

    <div class="copy">
      <p class="kicker">原生视频全屏 · 播放进度与系统时钟</p>
      <h1>全屏也能看时间</h1>
      <p class="lead">播放进度、总时长与系统时钟，始终留在视野中。</p>
      <div class="features">
        <div class="feature">播放进度<span>当前 / 总时长</span></div>
        <div class="feature">系统时钟<span>HH:MM:SS</span></div>
        <div class="feature">布局切换<span>F9 · 固定 / 浮动</span></div>
      </div>
    </div>

    <div class="footnote">不改变视频播放 · 可随时隐藏 · 键盘可操作</div>
  </div>
</body>
</html>
