<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="docHtmlTitle"></title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      background-color: #f5f7fa;
      color: #333;
      line-height: 1.6;
    }
    h1 {
      color: #0066cc;
      border-bottom: 3px solid #0066cc;
      padding-bottom: 10px;
    }
    h2 {
      color: #0052a3;
      margin-top: 30px;
    }
    .feature {
      background-color: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    code {
      background-color: #f0f0f0;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Consolas', monospace;
    }
    .tip {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 15px;
      margin: 20px 0;
    }
    .privacy {
      background-color: #e8f5e9;
      border-left: 4px solid #4caf50;
      padding: 15px;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <h1 data-i18n="docH1Title"></h1>
  
  <div class="feature">
    <h2 data-i18n="docFeatureTitle"></h2>
    <p data-i18n="docFeaturePara"></p>
    <ul>
      <li data-i18n="docFeatureItem1"></li>
      <li data-i18n="docFeatureItem2"></li>
      <li data-i18n="docFeatureItem3"></li>
      <li data-i18n="docFeatureItem4"></li>
    </ul>
  </div>

  <div class="feature">
    <h2 data-i18n="docHowToTitle"></h2>
    <ol>
      <li data-i18n="docHowToStep1"></li>
      <li data-i18n="docHowToStep2"></li>
      <li data-i18n="docHowToStep3"></li>
      <li data-i18n="docHowToStep4"></li>
    </ol>
  </div>

  <div class="feature">
    <h2 data-i18n="docSettingsTitle"></h2>
    <p data-i18n="docSettingShowVideo"></p>
    <p data-i18n="docSettingShowFullscreen"></p>
  </div>

  <div class="tip">
    <span data-i18n="docTip"></span>
  </div>

  <div class="feature">
    <h2 data-i18n="docTechTitle"></h2>
    <ul>
      <li data-i18n="docTechItem1"></li>
      <li data-i18n="docTechItem2"></li>
      <li data-i18n="docTechItem3"></li>
      <li data-i18n="docTechItem4"></li>
    </ul>
  </div>

  <div id="privacy" class="feature privacy">
    <h2 data-i18n="docPrivacyTitle"></h2>
    <p data-i18n="docPrivacyPara"></p>
  </div>

  <div class="feature">
    <h2 data-i18n="docVersionTitle"></h2>
    <p data-i18n="docVersionLabel"></p>
    <p data-i18n="docDateLabel"></p>
  </div>

  <script src="shared/i18n.js"></script>
  <script src="doc.js"></script>
</body>
</html>
