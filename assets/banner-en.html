<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fullscreen Time — README banner</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --bg-0: #070d18;
    --bg-1: #0a1424;
    --ink: #f7faff;
    --ink-2: #b9c9e0;
    --ink-3: #8da3c0;
    --accent: #6f97ff;
    --accent-soft: #a9c4ff;
    --line: rgba(150, 181, 255, 0.22);
  }

  html, body { margin: 0; width: 1600px; height: 600px; overflow: hidden; }

  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", "Helvetica Neue", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(900px 640px at 12% 16%, rgba(44, 85, 190, 0.28), transparent 64%),
      radial-gradient(960px 720px at 92% 72%, rgba(62, 106, 255, 0.18), transparent 66%),
      linear-gradient(145deg, var(--bg-1) 0%, #08111e 58%, var(--bg-0) 100%);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .stage {
    position: relative;
    width: 1600px;
    height: 600px;
    overflow: hidden;
    isolation: isolate;
  }

  .stage::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.68), transparent 64%);
    mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.68), transparent 64%);
    pointer-events: none;
  }

  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background: radial-gradient(125% 125% at 50% 42%, transparent 54%, rgba(3, 7, 15, 0.42) 100%);
    pointer-events: none;
  }

  /* ---------- Brand ---------- */

  .brand {
    position: absolute;
    top: 64px;
    left: 72px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .mark {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    border-radius: 13px;
    background: linear-gradient(160deg, #fdfefe 0%, #e8effc 100%);
    border: 1px solid rgba(255, 255, 255, 0.82);
    box-shadow:
      0 14px 30px rgba(2, 8, 22, 0.42),
      inset 0 1px 0 rgba(255, 255, 255, 0.96);
  }

  .mark img { display: block; width: 27px; height: 27px; }

  .brand-text { display: flex; flex-direction: column; gap: 3px; }

  .brand-name {
    color: var(--ink);
    font-size: 18px;
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: 0.005em;
  }

  .brand-sub {
    color: var(--ink-3);
    font-size: 10.5px;
    font-weight: 500;
    line-height: 1.2;
    letter-spacing: 0.09em;
  }

  /* ---------- Copy ---------- */

  .copy {
    position: absolute;
    top: 150px;
    left: 72px;
    z-index: 2;
    width: 690px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 7px 13px;
    border: 1px solid rgba(126, 162, 255, 0.28);
    border-radius: 999px;
    background: rgba(22, 44, 84, 0.5);
    color: var(--accent-soft);
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .eyebrow::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(111, 151, 255, 0.13);
  }

  h1 {
    margin: 20px 0 0;
    font-size: 72px;
    font-weight: 700;
    line-height: 1.02;
    letter-spacing: -0.045em;
    background: linear-gradient(180deg, #ffffff 18%, #c7d8f7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subhead-en {
    margin: 16px 0 0;
    max-width: 670px;
    color: var(--ink-2);
    font-size: 17.5px;
    font-weight: 400;
    line-height: 1.55;
    letter-spacing: 0.005em;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 26px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 37px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(38, 64, 112, 0.52), rgba(19, 36, 66, 0.5));
    color: #cfddf4;
    font-size: 12.5px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: 0.005em;
    white-space: nowrap;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .chip::before {
    content: "";
    flex: 0 0 auto;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(111, 151, 255, 0.12);
  }

  /* ---------- Footer ---------- */

  .footer {
    position: absolute;
    left: 72px;
    bottom: 64px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 12px;
    color: #7f94b0;
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1.4;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .footer::before {
    content: "";
    width: 24px;
    height: 1px;
    background: linear-gradient(90deg, var(--accent), rgba(111, 151, 255, 0));
  }

  .footer .dot { color: #5f7592; }

  /* ---------- Screenshot ---------- */

  .shot-wrap {
    position: absolute;
    top: 64px;
    right: 72px;
    z-index: 2;
    width: 696px;
    height: 472px;
  }

  .shot-wrap::before {
    content: "";
    position: absolute;
    inset: -58px -48px;
    background: radial-gradient(52% 52% at 50% 50%, rgba(72, 118, 255, 0.24), transparent 72%);
    filter: blur(6px);
    pointer-events: none;
  }

  .shot-card {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 12px;
    border: 1px solid rgba(203, 221, 255, 0.55);
    border-radius: 26px;
    background: linear-gradient(180deg, #f8fbff 0%, #e9f0fb 100%);
    box-shadow:
      0 44px 96px rgba(1, 6, 18, 0.56),
      0 16px 40px rgba(1, 6, 18, 0.32),
      inset 0 1px 0 rgba(255, 255, 255, 0.95);
  }

  .shot-viewport {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 14px;
    background: #edf3fb;
    box-shadow: inset 0 0 0 1px rgba(21, 39, 72, 0.08);
  }

  /* Actual English settings capture, cropped to the header and both shortcut
     rows. 1800px source shown at 780px CSS (0.433x) stays sharp at 2x export. */
  .shot-viewport img {
    position: absolute;
    top: -20px;
    left: 50%;
    display: block;
    width: 780px;
    height: auto;
    transform: translateX(-50%);
  }
</style>
</head>
<body>
  <div class="stage">

    <div class="brand">
      <span class="mark" aria-hidden="true">
        <img src="../extension/icons/icon.svg" alt="">
      </span>
      <span class="brand-text">
        <span class="brand-name">Fullscreen Time</span>
        <span class="brand-sub">Playback progress &amp; clock</span>
      </span>
    </div>

    <div class="copy">
      <div class="eyebrow">CHROME EXTENSION · MANIFEST V3</div>
      <h1>Time, even in<br>fullscreen</h1>
      <p class="subhead-en">Playback progress and the system clock, always in view.</p>

      <div class="chips">
        <span class="chip">Video / window overlay</span>
        <span class="chip">F9 / F10 shortcuts</span>
        <span class="chip">Snap / float layout</span>
        <span class="chip">English / 中文</span>
      </div>
    </div>

    <div class="footer">
      Chrome 114+&nbsp;&nbsp;<span class="dot">·</span>&nbsp;&nbsp;github.com/mrchipset/fullscreen-time
    </div>

    <div class="shot-wrap">
      <div class="shot-card">
        <div class="shot-viewport">
          <img src="../store/source/settings-en.png" alt="Fullscreen Time shortcut settings page in English">
        </div>
      </div>
    </div>

  </div>
</body>
</html>
